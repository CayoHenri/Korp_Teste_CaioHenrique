<div class="table-scroll">
  <table mat-table [dataSource]="produtos()">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let produto">
        <span class="product-code" [matTooltip]="produto.codigo">{{ produto.codigo }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let produto" class="description-cell">{{ produto.descricao }}</td>
    </ng-container>

    <ng-container matColumnDef="saldo">
      <th mat-header-cell *matHeaderCellDef>Saldo</th>
      <td mat-cell *matCellDef="let produto" class="number-cell">{{ produto.saldo }}</td>
    </ng-container>

    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef>Valor</th>
      <td mat-cell *matCellDef="let produto" class="number-cell">
        {{ produto.valor | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let produto">
        <span class="status" [class.status--inactive]="!produto.ativo">
          {{ produto.ativo ? 'Ativo' : 'Inativo' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="atualizado">
      <th mat-header-cell *matHeaderCellDef>Atualizado em</th>
      <td mat-cell *matCellDef="let produto">
        {{ produto.dataAtualizacao | date: 'dd/MM/yyyy HH:mm' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef><span class="sr-only">Ações</span></th>
      <td mat-cell *matCellDef="let produto" class="actions-cell">
        <button mat-icon-button type="button" aria-label="Editar produto" matTooltip="Editar" (click)="editar.emit(produto)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" [attr.aria-label]="produto.ativo ? 'Inativar produto' : 'Ativar produto'"
          [matTooltip]="produto.ativo ? 'Inativar' : 'Ativar'"
          (click)="alterarStatus.emit(produto)">
          <mat-icon>{{ produto.ativo ? 'toggle_on' : 'toggle_off' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>
</div>

<app-pagination [total]="total()" [pagina]="pagina()" [tamanhoPagina]="tamanhoPagina()"
  (mudou)="paginar.emit($event)" />
