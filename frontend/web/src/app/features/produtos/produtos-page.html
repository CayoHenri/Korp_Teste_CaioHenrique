<app-page-header eyebrow="Estoque" title="Produtos"
  description="Cadastre produtos e acompanhe saldo, valor e situação.">
  <button mat-flat-button class="page-action" type="button" (click)="abrirFormulario()">
    <mat-icon>add</mat-icon>
    Novo produto
  </button>
</app-page-header>

@if (store.state$ | async; as state) {
<mat-card class="filters-card">
  <app-produtos-filters (filterChange)="filtrar($event)" />
</mat-card>

<mat-card class="results-card">
  @if (state.carregando) {
  <mat-progress-bar mode="indeterminate" />
  }

  @if (state.erro) {
  <app-data-feedback type="error" title="Não foi possível carregar os produtos" [description]="state.erro"
    (retry)="store.carregar()" />
  }

  @if (!state.carregando && !state.erro && state.itens.length === 0) {
  <app-data-feedback type="empty" title="Nenhum produto encontrado"
    description="Altere os filtros ou cadastre o primeiro produto." />
  } @else if (state.itens.length > 0) {
  <app-produtos-list [produtos]="state.itens" [total]="state.total" [pagina]="state.filtros.pagina"
    [tamanhoPagina]="state.filtros.tamanhoPagina" (editar)="abrirFormulario($event)"
    (verMovimentacoes)="abrirMovimentacoes($any($event))" (alterarStatus)="alterarStatus($any($event))"
    (paginar)="paginar($event)" />
  }
</mat-card>
}
