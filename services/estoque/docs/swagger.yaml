basePath: /
definitions:
  dto.AtualizarProdutoRequest:
    properties:
      descricao:
        example: TECLADO MECANICO RGB
        type: string
      saldo:
        example: 20
        type: integer
    required:
    - descricao
    - saldo
    type: object
  dto.CriarProdutoRequest:
    properties:
      codigo:
        example: SKU-001
        type: string
      descricao:
        example: TECLADO MECANICO
        type: string
      saldo:
        example: 10
        type: integer
    type: object
  dto.ProdutoResponse:
    properties:
      ativo:
        type: boolean
      codigo:
        type: string
      dataAtualizacao:
        type: string
      dataCadastro:
        type: string
      descricao:
        type: string
      id:
        type: string
      saldo:
        type: integer
    type: object
  response.ErrorData:
    properties:
      code:
        example: PRODUTO_NAO_ENCONTRADO
        type: string
      message:
        example: produto nao encontrado
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorData'
      success:
        example: false
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      success:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: API do contexto de Estoque do Sistema de Emissao de Notas Fiscais.
  title: Estoque Service API
  version: "1.0"
paths:
  /health:
    get:
      description: Verifica se a API e a conexao com PostgreSQL estao disponiveis.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Verifica a saude do servico
      tags:
      - Health
  /produtos:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ProdutoResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Lista produtos
      tags:
      - Produtos
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do produto
        in: body
        name: produto
        required: true
        schema:
          $ref: '#/definitions/dto.CriarProdutoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProdutoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Cadastra um produto
      tags:
      - Produtos
  /produtos/{id}:
    get:
      parameters:
      - description: UUID do produto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProdutoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Consulta um produto por ID
      tags:
      - Produtos
    put:
      consumes:
      - application/json
      parameters:
      - description: UUID do produto
        in: path
        name: id
        required: true
        type: string
      - description: Campos atualizaveis
        in: body
        name: produto
        required: true
        schema:
          $ref: '#/definitions/dto.AtualizarProdutoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProdutoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Atualiza descricao e saldo de um produto
      tags:
      - Produtos
  /produtos/{id}/ativar:
    patch:
      parameters:
      - description: UUID do produto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProdutoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Ativa um produto
      tags:
      - Produtos
  /produtos/{id}/inativar:
    patch:
      parameters:
      - description: UUID do produto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProdutoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Inativa um produto sem exclui-lo
      tags:
      - Produtos
  /produtos/codigo/{codigo}:
    get:
      parameters:
      - description: Codigo do produto
        in: path
        name: codigo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProdutoResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Consulta um produto por codigo
      tags:
      - Produtos
swagger: "2.0"
